# Faster key response, especially noticeable in Neovim (this isn't a keybind change, just timing)
set -sg escape-time 10

# Increase scrollback buffer — default 2000 is too small
set -g history-limit 50000

# Enable mouse support (click panes, drag to resize, scroll) — additive, doesn't override existing binds
set -g mouse on

# Renumber windows automatically when one is closed, so you don't get gaps (1,2,4,5)
set -g renumber-windows on

# Focus events — lets Neovim/vim know when a pane gains/loses focus (autoread, etc.)
set -g focus-events on

# Aggressive resize — panes size based on the client actually looking at that window, not the smallest attached client
setw -g aggressive-resize on
